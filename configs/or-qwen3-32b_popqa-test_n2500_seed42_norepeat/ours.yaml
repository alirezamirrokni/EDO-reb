method: ours
seed: 7
output_dir: outputs
data:
  name: popqa
  hf_name: akariasai/PopQA
  hf_config: null
  split: test
  subset_size: 2500
  subset_seed: 42
  subset_strategy: random
  batch_size: 10
  num_batches: 250
  max_samples: 2500
  dataset_tag: norepeat
  sampling: without_replacement
main_llm:
  provider: openrouter
  model_name: qwen/qwen3-32b
  temperature: 0.0
  max_output_tokens: 128
  request_timeout: 180
  retry_attempts: 8
  retry_sleep: 2.0
  min_seconds_between_calls: 0.0
  display_name: or-qwen3-32b
  reasoning_effort: none
score_model:
  provider: minilm
  model_name: sentence-transformers/all-MiniLM-L6-v2
  max_length: 512
  encode_batch_size: 64
  pooling: mean
  torch_dtype: auto
  device: auto
  normalize_features: true
  cache_dir: null
policy:
  epsilon: 0.0
  alpha_step_size: 0.068
  theta_step_size: 1.0
  initial_alpha: 0.0
  theta_init_scale: 0.1
  warm_start_batches: 0
  budget_per_batch: 5
  cost_variant: constant
  l2_reg: 0.0
